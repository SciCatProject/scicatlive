name: Docker Compose CI

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changed-files.outputs.src_all_modified_files }}
      docs: ${{ steps.changed-files.outputs.docs_all_modified_files }}
      be_version_values: ${{
          steps.changed-files.outputs.v3_all_modified_files
          && '["v3","v4"]' || '["v4"]'
        }}
      opensearch_values: ${{
          steps.changed-files.outputs.opensearch_all_modified_files
          && '["","opensearch"]' || '[""]'
        }}
      jobs_values: ${{
          steps.changed-files.outputs.jobs_all_modified_files
          && '["","jobs"]' || '[""]'
        }}
      ldap_values: ${{
          steps.changed-files.outputs.ldap_all_modified_files
          && '["","ldap"]' || '[""]'
        }}
      oidc_values: ${{
          steps.changed-files.outputs.oidc_all_modified_files
          && '["","oidc"]' || '[""]'
        }}
      dev_values: ${{
          steps.changed-files.outputs.dev_all_modified_files
          && '["","dev"]' || '[""]'
        }}
    steps:
      - uses: actions/checkout@v7
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml_from_source_file: .github/changed_files.yaml
  check-mkdocs:
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.docs
    steps:
      - uses: SciCatProject/scicatlive/.github/actions/mkdocs-pages@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_LINK_CHECK: true
          TAG: ${{ github.sha }}
          docs_folder: ''
  test:
    runs-on: ubuntu-latest
    needs:
      - changes
      - check-mkdocs
    if: >
        ! failure()
        && ! cancelled()
        && needs.changes.outputs.src
    strategy:
      matrix:
        BE_VERSION: ${{ fromJson(needs.changes.outputs.be_version_values) }}
        OPENSEARCH_ENABLED: ${{
            fromJson(needs.changes.outputs.opensearch_values)
          }}
        JOBS_ENABLED: ${{ fromJson(needs.changes.outputs.jobs_values) }}
        LDAP_ENABLED: ${{ fromJson(needs.changes.outputs.ldap_values) }}
        OIDC_ENABLED: ${{ fromJson(needs.changes.outputs.oidc_values) }}
        DEV: ${{ fromJson(needs.changes.outputs.dev_values) }}
        GENERATE_SDK: ['']
        exclude:
          - OPENSEARCH_ENABLED: opensearch
            BE_VERSION: v3
        include:
          - BE_VERSION: v4
            DEV: dev
            GENERATE_SDK: generate_sdk
    steps:
      - uses: actions/checkout@v7
      - name: Test compose.yaml
        id: docker_up
        continue-on-error: ${{ matrix.GENERATE_SDK == 'generate_sdk' }}
        run: |-
          export JOBS_ENABLED=${{ matrix.JOBS_ENABLED }}
          export OPENSEARCH_ENABLED=${{ matrix.OPENSEARCH_ENABLED }}
          export LDAP_ENABLED=${{ matrix.LDAP_ENABLED }}
          export OIDC_ENABLED=${{ matrix.OIDC_ENABLED }}
          export BE_VERSION=${{ matrix.BE_VERSION }}
          export DEV=${{ matrix.DEV }}
          export DEV_BBACKUP=${DEV}
          export GENERATE_SDK=${{ matrix.GENERATE_SDK }}
          docker compose --profile '*' \
            -f compose.yaml ${DEV:+-f .github/compose.dev.test.yaml} \
            up --wait --wait-timeout 1200 \
            || {
              docker compose ps --status=exited --services \
                | while read service; do
                  echo "Logs for $service"
                  docker compose logs "$service"
                done
              exit 1
            }
      - name: Add Failure Label
        if: >-
          steps.docker_up.outcome == 'failure' &&
          matrix.GENERATE_SDK == 'generate_sdk'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body \
          "## ⚠️ SDK Generation Failed
          The SDK test failed. This is non-blocking, but please check \
          the logs before merging."
          gh pr edit ${{ github.event.pull_request.number }} --add-label \
          "sdk-failed"
      - name: Cleanup Failure Label
        if: >-
          steps.docker_up.outcome == 'success' &&
          matrix.GENERATE_SDK == 'generate_sdk'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove the label if it exists (ignore error if it's already gone)
          gh pr label remove ${{ github.event.pull_request.number }} \
          --name "sdk-failed" || true
  tests-status:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - check-mkdocs
      - test
    steps:
      - name: Evaluate Results
        run: |
          RES="${{ join(needs.*.result, ' ') }}"
          [[ $RES =~ "failure" || $RES =~ "cancelled" ]] && exit 1 || exit 0
