name: lintci smoke test

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - .github/compose.lintci.yaml
      - .github/workflows/lint.yaml
      - .github/actions/**

jobs:
  lintci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - id: run
        run: docker compose -f .github/compose.lintci.yaml run --rm lintci
      - name: Add Failure Label
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --add-label \
          "lintci-failed"
      - name: Cleanup Failure Label
        if: steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove the label if it exists (ignore error if it's already gone)
          gh pr edit ${{ github.event.pull_request.number }} \
          --remove-label "lintci-failed" || true
