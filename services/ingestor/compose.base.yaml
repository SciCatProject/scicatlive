services:
  ingestor:
    platform: linux/amd64
    image: ghcr.io/swissopenem/ingestor:1.3.2
    depends_on:
      backend:
        condition: service_healthy
    user: root
    configs:
      - source: openem-ingestor-config.yaml
        target: /config/openem-ingestor-config.yaml
        mode: 0555
      - source: move_config.sh
        target: /docker-entrypoints/20.sh
        mode: 0555
      - source: download_data.sh
        target: /docker-entrypoints/10.sh
        mode: 0555
      - source: entrypoints_loop_entrypoints_sh
        target: /usr/local/bin/loop_entrypoints.sh
        mode: 0555
    volumes:
      - ${_INGESTOR_DATA_DIR}:/data
    labels:
      - traefik.http.services.ingestor.loadbalancer.server.port=8080
    env_file:
      - ./config/.env
    extra_hosts:
      - keycloak.localhost:host-gateway
    entrypoint:
      - loop_entrypoints.sh
    command:
      - /app/ingestor

configs:
  openem-ingestor-config.yaml:
    file: ./config/openem-ingestor-config.yaml
  move_config.sh:
    file: ./entrypoints/move_config.sh
  download_data.sh:
    file: ./entrypoints/download_data.sh
